<div class="login-page">
  <div class="login-container">
    <div class="logo-section">
      <mat-icon class="logo-icon">restaurant_menu</mat-icon>
      <h1>Comanda</h1>
      <p>Sistema de gestão de pedidos</p>
    </div>

    <mat-card>
      <mat-tab-group>
        <!-- Login Tab -->
        <mat-tab label="Entrar">
          <div class="tab-content">
            <form (ngSubmit)="onLogin()">
              <mat-form-field appearance="outline" class="full-width" floatLabel="always">
                <mat-label>E-mail</mat-label>
                <input matInput type="email" [(ngModel)]="loginEmail" name="loginEmail"
                       placeholder="seu@email.com" required maxlength="200"
                       autocomplete="email">
                <mat-icon matPrefix>email</mat-icon>
              </mat-form-field>

              <mat-form-field appearance="outline" class="full-width" floatLabel="always">
                <mat-label>Senha</mat-label>
                <input matInput [type]="hideLoginPassword ? 'password' : 'text'"
                       [(ngModel)]="loginPassword" name="loginPassword" required maxlength="128"
                       autocomplete="current-password">
                <mat-icon matPrefix>lock</mat-icon>
                <button mat-icon-button matSuffix type="button"
                        (click)="hideLoginPassword = !hideLoginPassword">
                  <mat-icon>{{ hideLoginPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
              </mat-form-field>

              <button mat-raised-button color="primary" type="submit" class="full-width submit-btn"
                      [disabled]="loginLoading || !loginEmail || !loginPassword">
                <mat-spinner diameter="20" *ngIf="loginLoading"></mat-spinner>
                <span *ngIf="!loginLoading">Entrar</span>
              </button>
            </form>
          </div>
        </mat-tab>

        <!-- Register Tab -->
        <mat-tab label="Cadastrar Restaurante">
          <div class="tab-content">
            <h3>Dados Pessoais</h3>

            <mat-form-field appearance="outline" class="full-width" floatLabel="always">
              <mat-label>Seu nome</mat-label>
              <input matInput #nameInput
                     placeholder="Nome completo" maxlength="200"
                     autocomplete="name">
              <mat-icon matPrefix>person</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width" floatLabel="always">
              <mat-label>E-mail</mat-label>
              <input matInput #emailInput type="email"
                     placeholder="seu@email.com" maxlength="200"
                     autocomplete="email">
              <mat-icon matPrefix>email</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width" floatLabel="always">
              <mat-label>Senha</mat-label>
              <input matInput #passwordInput
                     [type]="hideRegPassword ? 'password' : 'text'"
                     maxlength="128" autocomplete="new-password">
              <mat-icon matPrefix>lock</mat-icon>
              <button mat-icon-button matSuffix type="button"
                      (click)="hideRegPassword = !hideRegPassword">
                <mat-icon>{{ hideRegPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>

            <h3>Dados do Estabelecimento</h3>

            <mat-form-field appearance="outline" class="full-width" floatLabel="always">
              <mat-label>Nome do estabelecimento</mat-label>
              <input matInput #businessNameInput
                     placeholder="Ex: Burguer do João" maxlength="200">
              <mat-icon matPrefix>storefront</mat-icon>
            </mat-form-field>

            <button mat-raised-button color="primary" class="full-width submit-btn"
                    [disabled]="regLoading"
                    (click)="onRegister(nameInput.value, emailInput.value, passwordInput.value, businessNameInput.value)">
              <mat-spinner diameter="20" *ngIf="regLoading"></mat-spinner>
              <span *ngIf="!regLoading">Criar Conta</span>
            </button>
          </div>
        </mat-tab>
      </mat-tab-group>
    </mat-card>
  </div>
</div>
