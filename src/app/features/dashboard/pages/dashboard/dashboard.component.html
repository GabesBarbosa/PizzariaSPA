<h1>Dashboard</h1>

<div class="actions-grid">
  <mat-card class="action-card" routerLink="/pedidos/novo">
    <mat-card-content>
      <div class="action">
        <mat-icon color="primary">add_circle</mat-icon>
        <div>
          <div class="action-title">Novo Pedido</div>
          <div class="action-desc">Criar um novo pedido</div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="action-card" routerLink="/pedidos">
    <mat-card-content>
      <div class="action">
        <mat-icon color="accent">receipt_long</mat-icon>
        <div>
          <div class="action-title">Pedidos</div>
          <div class="action-desc">Buscar pedidos por cliente</div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="action-card" routerLink="/clientes">
    <mat-card-content>
      <div class="action">
        <mat-icon color="primary">people</mat-icon>
        <div>
          <div class="action-title">Clientes</div>
          <div class="action-desc">Buscar e gerenciar clientes</div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="action-card" routerLink="/clientes/novo">
    <mat-card-content>
      <div class="action">
        <mat-icon color="accent">person_add</mat-icon>
        <div>
          <div class="action-title">Novo Cliente</div>
          <div class="action-desc">Cadastrar um novo cliente</div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
