<div class="page-header">
  <h1>Produtos</h1>
  <a mat-flat-button color="primary" routerLink="novo">
    <mat-icon>add</mat-icon> Novo Produto
  </a>
</div>

<app-loading *ngIf="loading"></app-loading>

<mat-card *ngIf="!loading">
  <mat-card-content>
    <table mat-table [dataSource]="products" class="full-width">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let p">{{ p.name }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Categoria</th>
        <td mat-cell *matCellDef="let p">
          <span class="category-chip">
            <mat-icon>{{ getCategoryIcon(p.category) }}</mat-icon>
            {{ getCategoryLabel(p.category) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Preço</th>
        <td mat-cell *matCellDef="let p">{{ p.price | brl }}</td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Estoque</th>
        <td mat-cell *matCellDef="let p">
          <div class="stock-cell">
            <span class="stock-chip"
                  [class.out]="isOutOfStock(p)"
                  [class.low]="isLowStock(p)"
                  [class.untracked]="!isTracked(p)">
              <mat-icon>{{ isOutOfStock(p) ? 'remove_shopping_cart' : 'inventory_2' }}</mat-icon>
              {{ getStockLabel(p) }}
            </span>
            <span class="stock-actions" *ngIf="isTracked(p)">
              <button mat-icon-button matTooltip="Remover 1 do estoque"
                      [disabled]="isAdjusting(p) || p.stockQuantity <= 0"
                      (click)="adjustStock(p, -1)">
                <mat-icon>remove</mat-icon>
              </button>
              <button mat-icon-button matTooltip="Adicionar 1 ao estoque"
                      [disabled]="isAdjusting(p)"
                      (click)="adjustStock(p, 1)">
                <mat-icon>add</mat-icon>
              </button>
            </span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let p">{{ p.description || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let p">
          <a mat-icon-button [routerLink]="[p.id, 'editar']" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="deleteProduct(p)" matTooltip="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
