<div class="page-header">
  <h1>Novo Produto</h1>
</div>

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" placeholder="Nome do produto">
        <mat-error *ngIf="form.get('name')?.hasError('required')">Nome é obrigatório</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="category">
          <mat-option value="pizza">Pizza</mat-option>
          <mat-option value="bebida">Bebida</mat-option>
          <mat-option value="outro">Outro</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('category')?.hasError('required')">Categoria é obrigatória</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Preço (R$)</mat-label>
        <input matInput formControlName="price" type="number" step="0.01" min="0" placeholder="0.00">
        <mat-error *ngIf="form.get('price')?.hasError('required')">Preço é obrigatório</mat-error>
        <mat-error *ngIf="form.get('price')?.hasError('min')">Preço deve ser maior que zero</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descrição</mat-label>
        <textarea matInput formControlName="description" rows="3" placeholder="Descrição do produto"></textarea>
      </mat-form-field>

      <div class="form-actions">
        <a mat-button routerLink="/produtos">Cancelar</a>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">
          {{ saving ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
