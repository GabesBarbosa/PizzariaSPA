<div class="page-header">
  <h1>Clientes</h1>
  <a mat-flat-button color="primary" routerLink="novo">
    <mat-icon>add</mat-icon> Novo Cliente
  </a>
</div>

<mat-card>
  <mat-card-content>
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar por nome ou telefone</mat-label>
      <input matInput [(ngModel)]="searchQuery" (ngModelChange)="onSearch($event)" placeholder="Digite para buscar...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <app-loading *ngIf="loading"></app-loading>

    <table mat-table [dataSource]="paginatedCustomers" *ngIf="!loading" class="full-width">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let c">{{ c.name }}</td>
      </ng-container>

      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Telefone</th>
        <td mat-cell *matCellDef="let c">{{ c.phone }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let c">{{ c.email }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let c">
          <a mat-icon-button [routerLink]="[c.id]" matTooltip="Ver detalhes">
            <mat-icon>visibility</mat-icon>
          </a>
          <a mat-icon-button [routerLink]="[c.id, 'editar']" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button color="warn" (click)="confirmDelete(c)" matTooltip="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [length]="customers.length"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="onPageChange($event)">
    </mat-paginator>
  </mat-card-content>
</mat-card>
