<div class="page-header">
  <h1>Pedidos</h1>
  <a mat-flat-button color="primary" routerLink="novo">
    <mat-icon>add</mat-icon> Novo Pedido
  </a>
</div>

<app-loading *ngIf="loading"></app-loading>

<mat-card *ngIf="!loading">
  <mat-card-content>
    <p *ngIf="orders.length === 0" class="hint-text">
      Nenhum pedido encontrado.
    </p>

    <table mat-table [dataSource]="orders" *ngIf="orders.length > 0" class="full-width">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let o">{{ o.id }}</td>
      </ng-container>

      <ng-container matColumnDef="customer">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let o">{{ o.customerName || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let o">{{ o.total | brl }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let o">
          <span class="status-badge" [ngClass]="'status-' + o.status">
            {{ getStatusLabel(o.status) }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Data</th>
        <td mat-cell *matCellDef="let o">{{ o.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let o" class="actions-cell">
          <button mat-mini-fab
                  *ngIf="getPrevStatus(o)"
                  color="warn"
                  (click)="revertStatus(o)"
                  [matTooltip]="'Voltar para: ' + getStatusLabel(getPrevStatus(o)!)"
                  class="action-btn back-btn">
            <mat-icon>undo</mat-icon>
          </button>
          <button mat-mini-fab
                  *ngIf="getNextStatus(o) as next"
                  [color]="next === 'DELIVERED' ? 'primary' : 'accent'"
                  (click)="advanceStatus(o)"
                  [matTooltip]="getStatusLabel(next)"
                  class="action-btn">
            <mat-icon>{{ getNextStatusIcon(next) }}</mat-icon>
          </button>
          <span *ngIf="!getNextStatus(o)" class="delivered-badge">
            <mat-icon>check_circle</mat-icon> Entregue
          </span>
          <button mat-icon-button
                  (click)="viewOrder(o)"
                  matTooltip="Ver detalhes"
                  class="view-btn">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button
                  (click)="editOrder(o)"
                  matTooltip="Editar pedido"
                  class="edit-btn">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button
                  color="warn"
                  (click)="deleteOrder(o)"
                  matTooltip="Excluir pedido"
                  class="delete-btn">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
